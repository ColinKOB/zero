name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never receive secrets, so skip them instead of failing.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The whole repository is checked out, so read beyond the diff.

            1. Read CLAUDE.md, AGENTS.md, and README if present for project rules.
            2. Read the diff with `gh pr diff`. For every changed function, type, route, or schema, search the repo for its callers and dependents and check whether the change breaks them.
            3. Report only real problems: bugs, broken callers, security issues, data loss, race conditions, missing error handling on a live path, and violations of the project rules. Skip style nitpicks and praise.
            4. Before posting, list existing review comments with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`. Do not repeat an issue that is already raised.
            5. Post each problem as an inline comment on the exact line, starting with `[blocking]` or `[minor]`.
            6. Post or update one summary comment with `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "..."`. Start it with `Claude review: APPROVE` or `Claude review: CHANGES_REQUESTED`, then list the blocking issues in one line each.

            Use CHANGES_REQUESTED only when at least one blocking issue exists.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","CHANGES_REQUESTED"]},"blocking_issues":{"type":"integer"}},"required":["verdict","blocking_issues"]}'

      - name: Fail on blocking issues
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(echo "$OUT" | jq -r '.verdict // empty')
          echo "Verdict: ${verdict:-none}"
          if [ "$verdict" != "APPROVE" ]; then
            echo "Claude review found blocking issues or returned no verdict. See the PR comments."
            exit 1
          fi

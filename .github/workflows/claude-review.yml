name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs never receive secrets, so skip them instead of failing.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The whole repository is checked out, so read beyond the diff.

            1. Read CLAUDE.md, AGENTS.md, and README if present for project rules.
            2. Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`. The checkout has no current branch, so always pass the PR number. For every changed function, type, route, or schema, search the repo for its callers and dependents and check whether the change breaks them.
            3. Report only real problems: bugs, broken callers, security issues, data loss, race conditions, missing error handling on a live path, and violations of the project rules. Skip style nitpicks and praise.
            4. Before posting, list existing review comments with `gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`. Do not repeat an issue that is already raised.
            5. Post each problem as an inline comment on the exact line, starting with `[blocking]` or `[minor]`.
            6. Do not post a summary comment yourself. Put the summary in the `summary` field of your structured output: the blocking issues in one line each, or one short line saying there are none.

            Use CHANGES_REQUESTED only when at least one blocking issue exists.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["APPROVE","CHANGES_REQUESTED"]},"blocking_issues":{"type":"integer"},"summary":{"type":"string"}},"required":["verdict","blocking_issues","summary"]}'

      - name: Post summary
        if: always() && steps.review.outputs.structured_output != ''
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- claude-review -->'
          # An APPROVE that still counts blocking issues is not an approval.
          verdict=$(jq -r 'if .verdict == "APPROVE" and .blocking_issues == 0 then "APPROVE" else "CHANGES_REQUESTED" end' <<<"$OUT")
          summary=$(jq -r '.summary // ""' <<<"$OUT")
          body=$(printf '%s\n**Claude review: %s**\n\n%s\n' "$marker" "$verdict" "$summary")
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body "$body"
          fi

      - name: Fail on blocking issues
        env:
          OUT: ${{ steps.review.outputs.structured_output }}
        run: |
          verdict=$(echo "$OUT" | jq -r '.verdict // empty')
          blocking=$(echo "$OUT" | jq -r '.blocking_issues // empty')
          echo "Verdict: ${verdict:-none}, blocking issues: ${blocking:-none}"
          if [ "$verdict" != "APPROVE" ] || [ "$blocking" != "0" ]; then
            echo "Claude review found blocking issues or returned no verdict. See the PR comments."
            exit 1
          fi

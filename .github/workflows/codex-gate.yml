name: Codex Review Gate

# Kept apart from Claude Review on purpose. Comment and review events start this workflow, and if they shared a
# workflow with the Claude review job, its skipped run would count as passing and could hide a failed review.
on:
  pull_request:
    # edited covers a PR retargeted to a different base, which changes the diff without a new commit.
    types: [opened, synchronize, ready_for_review, reopened, edited]
  # The Codex bot on GitHub reports through comments and reviews. deleted puts the gate back to pending.
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted]

jobs:
  # A PR needs a clean review from the Codex bot on GitHub for its latest commit. A local Codex run does not count.
  # This job keeps a "Codex review" status on the PR's head commit: pending until the bot reviews that commit,
  # failure when it finds problems or cannot run (for example out of credits), success when it finds none.
  codex:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: codex-gate-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # GitHub's machines unless the repo sets the REVIEW_RUNNER variable to a runner's labels as JSON, for example
    # ["self-hosted", "mac"] (Oct 17 2026: these reviews used most of the month's free Actions minutes).
    runs-on: ${{ fromJSON(vars.REVIEW_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      statuses: write
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - name: Set the Codex review status
        run: |
          bot='chatgpt-codex-connector[bot]'
          head=$(gh pr view "$PR" -R "$REPO" --json headRefOid --jq .headRefOid)
          state=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"$bot\") | select(.body | contains(\"codex-review-state:v1\")) | .body" \
            | { grep -o 'codex-review-state:v1 {.*}' || true; } | tail -n 1 | sed 's/^codex-review-state:v1 //')
          [ -n "$state" ] || state='{}'
          # A review from before the PR's last change of base covered a different diff, so it no longer counts.
          # The bot writes when the review finished into its summary table; the comment's own edit time can move later.
          reviewed_at=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"$bot\") | select(.body | contains(\"codex-review-state:v1\")) | .body" \
            | { grep -o 'datetime="[^"]*"' || true; } | tail -n 1 | cut -d'"' -f2)
          rebased_at=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq '.[] | select(.event == "base_ref_changed") | .created_at' | tail -n 1)
          # The summary has no start time, so a review that was already running at the retarget could finish after it
          # with the old diff (Codex review of zero-private#65). After a retarget, only a review asked for after it counts.
          requested_at=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.type != \"Bot\") | select(.body | test(\"@codex review\")) | .created_at" | tail -n 1)
          if [ -n "$rebased_at" ] && { [[ ! "$reviewed_at" > "$rebased_at" ]] || [[ ! "$requested_at" > "$rebased_at" ]]; }; then
            state='{}'
          fi
          verdict=$(jq -r --arg head "$head" '
            .code_review as $r
            | if $r.commit_sha != $head then "pending"
              elif $r.status == "completed" and $r.has_unresolved_findings == false then "success"
              elif $r.status == "completed" or $r.status == "failed" then "failure"
              else "pending" end' <<<"$state" 2>/dev/null || echo pending)
          case "$verdict" in
            success) desc="Codex found no problems in this commit." ;;
            failure) desc="Codex found problems or could not run. Read its comments." ;;
            # The bot reviews new PRs on its own. After a push, someone has to comment "@codex review" from a person's
            # account; on Oct 17 2026 it ignored the same request posted by github-actions.
            *) verdict=pending; desc="Waiting for Codex to review this commit. After a push, comment @codex review." ;;
          esac
          echo "Codex review for $head: $verdict"
          gh api -X POST "repos/$REPO/statuses/$head" -f state="$verdict" -f context="Codex review" -f description="$desc" >/dev/null

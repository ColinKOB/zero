# Rendered by zero-home-render. Rootless docker.service drop-in: containers never reach the host's loopback,
# and the egress rules run in the rootless namespace once the daemon is up.
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DISABLE_HOST_LOOPBACK=true
Environment=ZERO_HOME=%h/taffy/home.json
ExecStartPost=%h/taffy/bin/zip-egress-rules

# Drop-in for taffy-gateway.service (user unit) on alien.
# Install at ~/.config/systemd/user/taffy-gateway.service.d/docker.conf
# Points Hermes's docker CLI at the rootless daemon. Wants= (not Requires=) so the
# gateway still starts if Docker fails; Zips on the local backend are unaffected.
# %t is the user's runtime directory (/run/user/<uid>), so every home uses the same file.
[Unit]
Wants=docker.service
After=docker.service

[Service]
Environment=DOCKER_HOST=unix://%t/docker.sock
